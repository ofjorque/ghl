name: GHL Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name for testing (e.g., v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ghl-x86_64-unknown-linux-gnu.tar.gz
            binary_name: ghl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: ghl-aarch64-unknown-linux-gnu.tar.gz
            binary_name: ghl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ghl-aarch64-apple-darwin.tar.gz
            binary_name: ghl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ghl-x86_64-apple-darwin.tar.gz
            binary_name: ghl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ghl-x86_64-pc-windows-msvc.zip
            binary_name: ghl.exe

    steps:
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p ghl-cli

      - name: Package Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" stage/
          Copy-Item README.md stage/
          Copy-Item LICENSE stage/
          Compress-Archive -Path stage/* -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package Unix Artifact
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" stage/
          cp README.md stage/
          cp LICENSE stage/
          tar -czf "${{ matrix.artifact_name }}" -C stage .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  package-extension:
    name: Package Positron / VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx -y @vscode/vsce package --no-git-tag-version --no-dependencies -o ../../ghl-lang.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghl-lang.vsix
          path: ghl-lang.vsix

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release_artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
