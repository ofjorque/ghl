name: GHL Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ghl-x86_64-unknown-linux-gnu.tar.gz
            binary_name: ghl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ghl-x86_64-pc-windows-msvc.zip
            binary_name: ghl.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ghl-aarch64-apple-darwin.tar.gz
            binary_name: ghl

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p ghl-cli

      - name: Package Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package Unix Artifact
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "${{ matrix.artifact_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  package-extension:
    name: Package Positron / VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx -y @vscode/vsce package --no-git-tag-version

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghl-extension-vsix
          path: editors/vscode/*.vsix

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
          generate_release_notes: true
