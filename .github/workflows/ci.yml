name: GHL Multi-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --jobs 4

      - name: Run Fuzz Robustness Tests
        run: cargo test -p ghl-types --test fuzz_robustness --jobs 4

      - name: Check GHL Canonical Code Formatting
        run: cargo run -p ghl-cli --jobs 4 -- fmt --check validation/reference/compare_r.ghl

  performance-guard:
    name: Performance Regression Guard
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CLBG Microbenchmarks
        run: |
          cargo run -p ghl-cli --release --jobs 4 -- run benchmarks/scripts/suite_06_clbg/bench_spectral_norm.ghl
          cargo run -p ghl-cli --release --jobs 4 -- run benchmarks/scripts/suite_06_clbg/bench_tail_recursion.ghl
