name: GHL Multi-Platform CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scratch/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run CLBG Performance Microbenchmarks'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint-and-format:
    name: Lint & Code Style (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Workspace Clippy Check
        run: cargo clippy --workspace -- -D warnings

      - name: Workspace Typecheck (cargo check)
        run: cargo check --workspace

  test-matrix:
    name: Test (${{ matrix.os }})
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Free Disk Space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace --jobs 4

      - name: Build GHL CLI
        run: cargo build -p ghl-cli --jobs 4

      - name: Check GHL Canonical Code Formatting
        run: cargo run -p ghl-cli --jobs 4 -- fmt --check validation/reference/compare_r.ghl

      - name: Run GHL Packages Test Suite
        shell: bash
        run: |
          GHL_BIN="./target/debug/ghl"
          if [ -f "./target/debug/ghl.exe" ]; then
            GHL_BIN="./target/debug/ghl.exe"
          fi
          for pkg in packages/*; do
            if [ -d "$pkg" ]; then
              echo "=== Testing GHL Package: $pkg ==="
              "$GHL_BIN" test "$pkg"
            fi
          done

  performance-guard:
    name: Performance Regression Guard
    if: github.event.inputs.run_benchmarks == 'true'
    runs-on: ubuntu-latest
    needs: test-matrix

    steps:
      - name: Free Disk Space (Linux)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run CLBG Microbenchmarks
        run: |
          cargo run -p ghl-cli --release --jobs 4 -- run benchmarks/scripts/suite_06_clbg/bench_spectral_norm.ghl
          cargo run -p ghl-cli --release --jobs 4 -- run benchmarks/scripts/suite_06_clbg/bench_tail_recursion.ghl
