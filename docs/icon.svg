      <g clip-path="url(#gojoClip)" stroke="none">
        <!-- Pecho claro -->
        <ellipse cx="196" cy="290" rx="22" ry="38" fill="#e6e7ea"/>
        <!-- Rayas del costado -->
        <path d="M90 258 Q114 252 136 264 Q114 272 90 272 Z" fill="#999da5"/>
        <path d="M90 286 Q118 280 140 294 Q118 302 90 300 Z" fill="#999da5"/>
        <path d="M90 316 Q116 310 136 324 Q116 330 90 330 Z" fill="#999da5"/>
        <path d="M252 252 Q236 254 228 264 Q240 266 252 264 Z" fill="#999da5"/>
        <path d="M252 280 Q236 282 230 292 Q242 294 252 292 Z" fill="#999da5"/>
        <!-- Rayas de la frente -->
