        <path d="M186 132 Q189 156 186 172 Q180 156 179 132 Z" fill="#999da5"/>
        <path d="M206 134 Q203 152 202 166 Q210 152 213 134 Z" fill="#999da5"/>
        <!-- Rayas de las mejillas -->
        <path d="M120 188 Q136 190 146 196 Q134 200 120 198 Z" fill="#999da5"/>
        <path d="M120 206 Q134 206 144 210 Q132 216 120 214 Z" fill="#999da5"/>
      </g>

      <!-- Contorno de Gojo -->
      <path d="M126 190 C124 170 128 152 132 140 Q132 126 140 117 Q157 123 172 137 Q190 131 208 135 Q223 120 238 113 Q245 128 242 150 C248 166 250 188 244 206 C240 220 232 230 228 236 C242 258 250 290 248 320 C246 350 228 365 196 365 L150 365 C110 365 94 342 96 310 C98 274 118 248 134 236 C128 228 125 210 126 190 Z" fill="none"/>

      <!-- Interior de las orejas -->
      <path d="M141 128 Q152 132 161 139 Q150 142 138 148 Q137 136 141 128 Z" fill="#f5b3c0" stroke="none"/>
      <path d="M234 123 Q223 129 217 137 Q228 140 238 147 Q238 134 234 123 Z" fill="#f5b3c0" stroke="none"/>

      <!-- Hocico -->
      <ellipse cx="182" cy="206" rx="16" ry="11" fill="#e6e7ea" stroke="none"/>
      <!-- Ojos -->
      <ellipse cx="156" cy="188" rx="8" ry="9.5" fill="#322225" stroke="none"/>
      <circle cx="159" cy="184.5" r="3" fill="#ffffff" stroke="none"/>
      <ellipse cx="208" cy="188" rx="8" ry="9.5" fill="#322225" stroke="none"/>
      <circle cx="211" cy="184.5" r="3" fill="#ffffff" stroke="none"/>
      <!-- Rubor -->
      <ellipse cx="142" cy="210" rx="8" ry="5" fill="#f5a3b4" opacity="0.55" stroke="none"/>
      <ellipse cx="222" cy="210" rx="8" ry="5" fill="#f5a3b4" opacity="0.55" stroke="none"/>
      <!-- Nariz y boca -->
      <path d="M177 199 Q182 197 187 199 Q184 204 182 204 Q180 204 177 199 Z" fill="#3c2c2f" stroke="none"/>
      <path d="M173 208 Q178 214 182 208 Q186 214 191 208" fill="none" stroke-width="2.6"/>

      <!-- Patas delanteras -->
      <path d="M160 308 L162 362" fill="none"/>
      <path d="M194 312 L194 362" fill="none"/>
    </g>

    <!-- ==================== HARU (Blanco y Durazno) ==================== -->
    <g id="haru">
      <!-- Cuerpo base -->
      <path d="M386 190 C388 170 384 152 380 140 Q380 126 372 117 Q355 123 340 137 Q322 131 304 135 Q289 120 274 113 Q267 128 270 150 C264 166 262 188 268 206 C272 220 280 230 284 236 C270 258 262 290 264 320 C266 350 284 365 316 365 L362 365 C402 365 418 342 416 310 C414 274 394 248 378 236 C384 228 387 210 386 190 Z" fill="#ffffff"/>

      <g clip-path="url(#haruClip)" stroke="none" fill="#f4b58c">
        <!-- Gorrito durazno en la cabeza -->
        <path d="M250 100 L410 100 L410 186 Q394 192 382 182 Q370 168 354 170 Q336 174 328 158 Q316 146 300 152 Q286 158 276 150 Q262 142 250 146 Z"/>
        <!-- Mancha grande del lomo -->
        <path d="M420 240 Q386 238 376 262 Q364 292 382 316 Q398 334 420 326 Z"/>
        <!-- Manchitas de las patas -->
        <ellipse cx="300" cy="362" rx="16" ry="8"/>
        <ellipse cx="360" cy="364" rx="12" ry="6"/>
      </g>

      <!-- Contorno de Haru -->
      <path d="M386 190 C388 170 384 152 380 140 Q380 126 372 117 Q355 123 340 137 Q322 131 304 135 Q289 120 274 113 Q267 128 270 150 C264 166 262 188 268 206 C272 220 280 230 284 236 C270 258 262 290 264 320 C266 350 284 365 316 365 L362 365 C402 365 418 342 416 310 C414 274 394 248 378 236 C384 228 387 210 386 190 Z" fill="none"/>

      <!-- Interior de las orejas -->
      <path d="M371 128 Q360 132 351 139 Q362 142 374 148 Q375 136 371 128 Z" fill="#f5b3c0" stroke="none"/>
      <path d="M278 123 Q289 129 295 137 Q284 140 274 147 Q274 134 278 123 Z" fill="#f5b3c0" stroke="none"/>

      <!-- Ojos -->
      <ellipse cx="304" cy="190" rx="8" ry="9.5" fill="#322225" stroke="none"/>
      <circle cx="307" cy="186.5" r="3" fill="#ffffff" stroke="none"/>
      <ellipse cx="356" cy="190" rx="8" ry="9.5" fill="#322225" stroke="none"/>
      <circle cx="359" cy="186.5" r="3" fill="#ffffff" stroke="none"/>
      <!-- Rubor -->
      <ellipse cx="290" cy="212" rx="8" ry="5" fill="#f5a3b4" opacity="0.55" stroke="none"/>
      <ellipse cx="370" cy="212" rx="8" ry="5" fill="#f5a3b4" opacity="0.55" stroke="none"/>
      <!-- Nariz y boca -->
      <path d="M325 201 Q330 199 335 201 Q332 206 330 206 Q328 206 325 201 Z" fill="#f29ea7" stroke="none"/>
      <path d="M321 210 Q326 216 330 210 Q334 216 339 210" fill="none" stroke-width="2.6"/>

      <!-- Patas delanteras -->
      <path d="M318 312 L318 362" fill="none"/>
      <path d="M352 308 L350 362" fill="none"/>
    </g>

    <!-- ==================== COLAS FORMANDO CORAZÓN LIMPIO ==================== -->
    <g id="heartTails">
      <!-- Cola de Gojo (Mitad izquierda del corazón) -->
      <!-- Borde oscuro -->
      <path d="M140 355 C120 405 185 435 225 395 C245 375 256 340 256 325" fill="none" stroke="#3c2c2f" stroke-width="18" stroke-linecap="round"/>
      <!-- Relleno gris atigrado -->
      <path d="M140 355 C120 405 185 435 225 395 C245 375 256 340 256 325" fill="none" stroke="#b7bac0" stroke-width="11" stroke-linecap="round"/>
      <!-- Rayitas en la cola -->
      <path d="M152 385 L158 395 M180 415 L188 423 M215 410 L223 416" fill="none" stroke="#999da5" stroke-width="3" stroke-linecap="round"/>

      <!-- Cola de Haru (Mitad derecha del corazón) -->
      <!-- Borde oscuro -->
      <path d="M372 355 C392 405 327 435 287 395 C267 375 256 340 256 325" fill="none" stroke="#3c2c2f" stroke-width="18" stroke-linecap="round"/>
      <!-- Relleno blanco -->
      <path d="M372 355 C392 405 327 435 287 395 C267 375 256 340 256 325" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
      <!-- Punta durazno -->
      <path d="M266 342 C260 332 256 325 256 325" fill="none" stroke="#f4b58c" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>
</svg>
