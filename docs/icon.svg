<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bce8fd"/>
      <stop offset="50%" stop-color="#d9dbfa"/>
      <stop offset="100%" stop-color="#fbd6ea"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9ecfd"/>
      <stop offset="50%" stop-color="#e4e3fb"/>
      <stop offset="100%" stop-color="#fbd9eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7a7099" flood-opacity="0.22"/>
    </filter>

    <clipPath id="gojoClip">
      <path d="M126 190 C124 170 128 152 132 140 Q132 126 140 117 Q157 123 172 137 Q190 131 208 135 Q223 120 238 113 Q245 128 242 150 C248 166 250 188 244 206 C240 220 232 230 228 236 C242 258 250 290 248 320 C246 350 228 365 196 365 L150 365 C110 365 94 342 96 310 C98 274 118 248 134 236 C128 228 125 210 126 190 Z"/>
    </clipPath>

    <clipPath id="haruClip">
      <path d="M386 190 C388 170 384 152 380 140 Q380 126 372 117 Q355 123 340 137 Q322 131 304 135 Q289 120 274 113 Q267 128 270 150 C264 166 262 188 268 206 C272 220 280 230 284 236 C270 258 262 290 264 320 C266 350 284 365 316 365 L362 365 C402 365 418 342 416 310 C414 274 394 248 378 236 C384 228 387 210 386 190 Z"/>
    </clipPath>
  </defs>

  <!-- Fondo y tarjeta tipo icono de app -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect x="58" y="58" width="396" height="396" rx="92" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="58" y="58" width="396" height="396" rx="92" fill="#ffffff" opacity="0.25"/>

  <!-- Sombra suave en el suelo -->
  <ellipse cx="256" cy="372" rx="168" ry="14" fill="#9a8fbf" opacity="0.30"/>

  <g stroke="#3c2c2f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

