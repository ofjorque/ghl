[package]
name = "ghl-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Language Server Protocol (LSP) implementation for GHL"

[dependencies]
ghl-syntax = { path = "../ghl-syntax" }
ghl-diagnostics = { path = "../ghl-diagnostics" }
ghl-types = { path = "../ghl-types" }
ghl-runtime = { path = "../ghl-runtime" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde_json = "1.0"

[lints]
workspace = true

