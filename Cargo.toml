[workspace]
members = [
    "crates/ghl-syntax",
    "crates/ghl-diagnostics",
    "crates/ghl-types",
    "crates/ghl-ir",
    "crates/ghl-codegen",
    "crates/ghl-runtime",
    "crates/ghl-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Oscar Jorquera"]
license = "MIT OR Apache-2.0"
description = "Generalized Hypothesis Language (GHL): High-Performance Statistical Computing with Warm Empathy"
repository = "https://github.com/ofjorque/ghl"
readme = "README.md"

